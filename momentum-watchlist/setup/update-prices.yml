name: Refresh prices and deploy

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes, weekdays, 13:00-21:59 UTC (covers US market hours).
    # GitHub may delay scheduled runs by several minutes at busy times.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest prices
        run: python scripts/update_prices.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
